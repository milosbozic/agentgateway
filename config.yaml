# yaml-language-server: $schema=https://agentgateway.dev/schema/config
config:
  storage:
    mode: hybrid
  database:
    url: ${DATABASE_URL}
gateways:
  default:
    port: 4000
ui:
  gateways: default
  policies:
    basicAuth:
      mode: strict
      htpasswd: ${UI_HTPASSWD}
      realm: agentgateway
llm:
  policies:
    apiKey:
      mode: strict
      keys:
      - key: ${LLM_API_KEY}
        metadata:
          name: bootstrap
  providers: []
  models: []
  virtualModels: []
mcp:
  policies:
    apiKey:
      mode: strict
      keys:
      - key: ${LLM_API_KEY}
        metadata:
          name: bootstrap
  targets: []
  frontendPolicies:
  accessLog:
    database:
      llm: full